<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="au" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <filter id="su" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1100" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">DefectLoupe — UML Use Case Diagram</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#64748b">Actors and System Interactions</text>

  <!-- ===== ACTORS ===== -->
  <!-- Inspector (primary) -->
  <circle cx="60" cy="180" r="15" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="195" x2="60" y2="240" stroke="#334155" stroke-width="2"/>
  <line x1="35" y1="215" x2="85" y2="215" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="240" x2="40" y2="275" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="240" x2="80" y2="275" stroke="#334155" stroke-width="2"/>
  <text x="60" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Inspector</text>
  <text x="60" y="310" text-anchor="middle" font-size="10" fill="#64748b">(Primary Actor)</text>

  <!-- Agency Owner -->
  <circle cx="60" cy="420" r="15" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="435" x2="60" y2="480" stroke="#334155" stroke-width="2"/>
  <line x1="35" y1="455" x2="85" y2="455" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="480" x2="40" y2="515" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="480" x2="80" y2="515" stroke="#334155" stroke-width="2"/>
  <text x="60" y="535" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Agency Owner</text>
  <text x="60" y="550" text-anchor="middle" font-size="10" fill="#64748b">(extends Inspector)</text>

  <!-- Client -->
  <circle cx="1040" cy="350" r="15" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="1040" y1="365" x2="1040" y2="410" stroke="#334155" stroke-width="2"/>
  <line x1="1015" y1="385" x2="1065" y2="385" stroke="#334155" stroke-width="2"/>
  <line x1="1040" y1="410" x2="1020" y2="445" stroke="#334155" stroke-width="2"/>
  <line x1="1040" y1="410" x2="1060" y2="445" stroke="#334155" stroke-width="2"/>
  <text x="1040" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Client</text>
  <text x="1040" y="480" text-anchor="middle" font-size="10" fill="#64748b">(Report Recipient)</text>

  <!-- External Systems -->
  <rect x="990" y="570" width="100" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1040" y="592" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Gemini AI</text>
  <text x="1040" y="607" text-anchor="middle" font-size="9" fill="#64748b">(Vision)</text>

  <rect x="990" y="650" width="100" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1040" y="672" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Resend API</text>
  <text x="1040" y="687" text-anchor="middle" font-size="9" fill="#64748b">(Email)</text>

  <rect x="990" y="730" width="100" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1040" y="752" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Whisper STT</text>
  <text x="1040" y="767" text-anchor="middle" font-size="9" fill="#64748b">(Speech-to-Text)</text>

  <!-- ===== SYSTEM BOUNDARY ===== -->
  <rect x="160" y="80" width="780" height="800" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">DefectLoupe System</text>

  <!-- ===== USE CASES ===== -->

  <!-- Authentication Group -->
  <rect x="185" y="120" width="230" height="230" rx="8" fill="#eff6ff" fill-opacity="0.3" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="300" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Authentication &amp; Accounts</text>

  <ellipse cx="300" cy="165" rx="90" ry="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="170" text-anchor="middle" font-size="10" fill="#1e293b">Register Account</text>

  <ellipse cx="300" cy="205" rx="90" ry="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="210" text-anchor="middle" font-size="10" fill="#1e293b">Login / Logout</text>

  <ellipse cx="300" cy="245" rx="90" ry="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="250" text-anchor="middle" font-size="10" fill="#1e293b">Verify Email</text>

  <ellipse cx="300" cy="285" rx="90" ry="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="290" text-anchor="middle" font-size="10" fill="#1e293b">Manage Profile</text>

  <ellipse cx="300" cy="325" rx="90" ry="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="330" text-anchor="middle" font-size="10" fill="#1e293b">Create Company</text>

  <!-- Client & Property Group -->
  <rect x="440" y="120" width="230" height="180" rx="8" fill="#f0fdf4" fill-opacity="0.3" stroke="#86efac" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="555" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Client &amp; Property Mgmt</text>

  <ellipse cx="555" cy="170" rx="90" ry="18" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#su)"/>
  <text x="555" y="175" text-anchor="middle" font-size="10" fill="#1e293b">Manage Clients (CRUD)</text>

  <ellipse cx="555" cy="210" rx="90" ry="18" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#su)"/>
  <text x="555" y="215" text-anchor="middle" font-size="10" fill="#1e293b">Manage Properties (CRUD)</text>

  <ellipse cx="555" cy="250" rx="90" ry="18" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#su)"/>
  <text x="555" y="255" text-anchor="middle" font-size="10" fill="#1e293b">View Property History</text>

  <ellipse cx="555" cy="290" rx="90" ry="18" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#su)"/>
  <text x="555" y="295" text-anchor="middle" font-size="10" fill="#1e293b">View Dashboard Stats</text>

  <!-- Inspection Group -->
  <rect x="700" y="120" width="220" height="200" rx="8" fill="#fefce8" fill-opacity="0.3" stroke="#fde047" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="810" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#a16207">Inspection Management</text>

  <ellipse cx="810" cy="170" rx="85" ry="18" fill="#ffffff" stroke="#eab308" stroke-width="1.5" filter="url(#su)"/>
  <text x="810" y="175" text-anchor="middle" font-size="10" fill="#1e293b">Create Inspection</text>

  <ellipse cx="810" cy="210" rx="85" ry="18" fill="#ffffff" stroke="#eab308" stroke-width="1.5" filter="url(#su)"/>
  <text x="810" y="215" text-anchor="middle" font-size="10" fill="#1e293b">Manage Areas</text>

  <ellipse cx="810" cy="250" rx="85" ry="18" fill="#ffffff" stroke="#eab308" stroke-width="1.5" filter="url(#su)"/>
  <text x="810" y="255" text-anchor="middle" font-size="10" fill="#1e293b">Reorder Areas</text>

  <ellipse cx="810" cy="290" rx="85" ry="18" fill="#ffffff" stroke="#eab308" stroke-width="1.5" filter="url(#su)"/>
  <text x="810" y="295" text-anchor="middle" font-size="10" fill="#1e293b">Update Status</text>

  <!-- Media Group -->
  <rect x="185" y="370" width="230" height="180" rx="8" fill="#fef2f2" fill-opacity="0.3" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="300" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">Media Capture</text>

  <ellipse cx="300" cy="420" rx="90" ry="18" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="425" text-anchor="middle" font-size="10" fill="#1e293b">Upload Photos</text>

  <ellipse cx="300" cy="460" rx="90" ry="18" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="465" text-anchor="middle" font-size="10" fill="#1e293b">Record Voice Notes</text>

  <ellipse cx="300" cy="500" rx="90" ry="18" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="505" text-anchor="middle" font-size="10" fill="#1e293b">View Transcriptions</text>

  <ellipse cx="300" cy="540" rx="90" ry="18" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="545" text-anchor="middle" font-size="10" fill="#1e293b">Edit Transcriptions</text>

  <!-- AI Features Group -->
  <rect x="440" y="370" width="230" height="200" rx="8" fill="#faf5ff" fill-opacity="0.3" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="555" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">AI Features</text>

  <ellipse cx="555" cy="420" rx="90" ry="18" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#su)"/>
  <text x="555" y="425" text-anchor="middle" font-size="10" fill="#1e293b">Analyze Photo Defects</text>

  <ellipse cx="555" cy="460" rx="90" ry="18" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#su)"/>
  <text x="555" y="465" text-anchor="middle" font-size="10" fill="#1e293b">Search Knowledge Base</text>

  <ellipse cx="555" cy="500" rx="90" ry="18" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#su)"/>
  <text x="555" y="505" text-anchor="middle" font-size="10" fill="#1e293b">Generate Report (PDF)</text>

  <ellipse cx="555" cy="540" rx="90" ry="18" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#su)"/>
  <text x="555" y="545" text-anchor="middle" font-size="10" fill="#1e293b">Upload RAG Documents</text>

  <!-- Report & Verification Group -->
  <rect x="700" y="370" width="220" height="150" rx="8" fill="#f0fdf4" fill-opacity="0.3" stroke="#86efac" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="810" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Report &amp; Verification</text>

  <ellipse cx="810" cy="420" rx="85" ry="18" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#su)"/>
  <text x="810" y="425" text-anchor="middle" font-size="10" fill="#1e293b">Download PDF Report</text>

  <ellipse cx="810" cy="460" rx="85" ry="18" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#su)"/>
  <text x="810" y="465" text-anchor="middle" font-size="10" fill="#1e293b">Verify Report (QR)</text>

  <ellipse cx="810" cy="500" rx="85" ry="18" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#su)"/>
  <text x="810" y="505" text-anchor="middle" font-size="10" fill="#1e293b">View Report Online</text>

  <!-- Agency-specific use cases -->
  <rect x="185" y="580" width="230" height="100" rx="8" fill="#eff6ff" fill-opacity="0.3" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="300" y="600" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Agency Management</text>

  <ellipse cx="300" cy="630" rx="90" ry="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="635" text-anchor="middle" font-size="10" fill="#1e293b">Add Sub-Inspectors</text>

  <ellipse cx="300" cy="668" rx="90" ry="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#su)"/>
  <text x="300" y="673" text-anchor="middle" font-size="10" fill="#1e293b">Manage Company</text>

  <!-- ===== RELATIONSHIP LINES ===== -->

  <!-- Inspector → Auth use cases -->
  <line x1="85" y1="200" x2="210" y2="165" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="210" x2="210" y2="205" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="220" x2="210" y2="245" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="230" x2="210" y2="285" stroke="#334155" stroke-width="1.2"/>

  <!-- Inspector → Client/Property -->
  <line x1="85" y1="215" x2="465" y2="170" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="220" x2="465" y2="210" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="225" x2="465" y2="250" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="230" x2="465" y2="290" stroke="#334155" stroke-width="1.2"/>

  <!-- Inspector → Inspection -->
  <line x1="85" y1="210" x2="725" y2="170" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="215" x2="725" y2="210" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="220" x2="725" y2="250" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="225" x2="725" y2="290" stroke="#334155" stroke-width="1.2"/>

  <!-- Inspector → Media -->
  <line x1="80" y1="250" x2="210" y2="420" stroke="#334155" stroke-width="1.2"/>
  <line x1="80" y1="255" x2="210" y2="460" stroke="#334155" stroke-width="1.2"/>
  <line x1="80" y1="260" x2="210" y2="500" stroke="#334155" stroke-width="1.2"/>
  <line x1="80" y1="265" x2="210" y2="540" stroke="#334155" stroke-width="1.2"/>

  <!-- Inspector → AI Features -->
  <line x1="85" y1="240" x2="465" y2="420" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="245" x2="465" y2="460" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="250" x2="465" y2="500" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="255" x2="465" y2="540" stroke="#334155" stroke-width="1.2"/>

  <!-- Inspector → Report -->
  <line x1="85" y1="235" x2="725" y2="420" stroke="#334155" stroke-width="1.2"/>

  <!-- Agency Owner → Agency use cases -->
  <line x1="85" y1="450" x2="210" y2="630" stroke="#334155" stroke-width="1.2"/>
  <line x1="85" y1="460" x2="210" y2="668" stroke="#334155" stroke-width="1.2"/>

  <!-- Agency Owner inherits Inspector (<<extend>>) -->
  <line x1="60" y1="310" x2="60" y2="420" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="75" y="370" font-size="9" fill="#64748b">&lt;&lt;extends&gt;&gt;</text>

  <!-- Client → Verify Report -->
  <line x1="1025" y1="380" x2="895" y2="460" stroke="#334155" stroke-width="1.2"/>

  <!-- ===== INCLUDES / EXTENDS ===== -->
  <!-- Generate Report includes Analyze Photo Defects -->
  <line x1="555" y1="482" x2="555" y2="438" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#au)"/>
  <text x="570" y="463" font-size="8" fill="#64748b">&lt;&lt;includes&gt;&gt;</text>

  <!-- Generate Report includes Search Knowledge Base -->
  <path d="M 530 482 Q 480 470 530 460" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#au)"/>
  <text x="475" y="475" font-size="8" fill="#64748b">&lt;&lt;includes&gt;&gt;</text>

  <!-- Record Voice Notes extends View Transcriptions -->
  <line x1="300" y1="442" x2="300" y2="482" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#au)"/>
  <text x="315" y="465" font-size="8" fill="#64748b">&lt;&lt;extends&gt;&gt;</text>

  <!-- ===== EXTERNAL SYSTEM CONNECTIONS ===== -->
  <!-- Analyze Photo Defects → Gemini -->
  <line x1="645" y1="420" x2="990" y2="590" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="830" y="490" font-size="8" fill="#a855f7">calls</text>

  <!-- Register Account → Resend -->
  <line x1="390" y1="165" x2="990" y2="670" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Record Voice → Whisper -->
  <line x1="390" y1="460" x2="990" y2="750" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="700" y="610" font-size="8" fill="#ef4444">calls</text>

  <!-- ===== LEGEND ===== -->
  <rect x="185" y="720" width="735" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="550" y="742" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Legend</text>

  <!-- Actor -->
  <circle cx="220" cy="770" r="8" fill="none" stroke="#334155" stroke-width="1.5"/>
  <line x1="220" y1="778" x2="220" y2="798" stroke="#334155" stroke-width="1.5"/>
  <line x1="210" y1="788" x2="230" y2="788" stroke="#334155" stroke-width="1.5"/>
  <text x="245" y="790" font-size="10" fill="#475569">Actor (stick figure)</text>

  <!-- Use Case -->
  <ellipse cx="400" cy="785" rx="40" ry="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="789" text-anchor="middle" font-size="9" fill="#1e293b">Use Case</text>
  <text x="455" y="790" font-size="10" fill="#475569">Use Case (ellipse)</text>

  <!-- Association -->
  <line x1="560" y1="785" x2="610" y2="785" stroke="#334155" stroke-width="1.2"/>
  <text x="625" y="790" font-size="10" fill="#475569">Association</text>

  <!-- Include/Extend -->
  <line x1="720" y1="785" x2="770" y2="785" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="785" y="790" font-size="10" fill="#475569">&lt;&lt;includes&gt;&gt; / &lt;&lt;extends&gt;&gt;</text>

  <text x="550" y="830" text-anchor="middle" font-size="10" fill="#475569">Inspector: Primary actor who performs all inspection workflows</text>
  <text x="550" y="845" text-anchor="middle" font-size="10" fill="#475569">Agency Owner: Extends Inspector with company management and sub-inspector administration</text>

  <!-- Color groups legend -->
  <rect x="220" y="855" width="12" height="12" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="240" y="866" font-size="9" fill="#475569">Auth</text>

  <rect x="290" y="855" width="12" height="12" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="310" y="866" font-size="9" fill="#475569">Core</text>

  <rect x="360" y="855" width="12" height="12" rx="2" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="380" y="866" font-size="9" fill="#475569">Inspection</text>

  <rect x="450" y="855" width="12" height="12" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="470" y="866" font-size="9" fill="#475569">Media</text>

  <rect x="530" y="855" width="12" height="12" rx="2" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="550" y="866" font-size="9" fill="#475569">AI</text>

  <rect x="600" y="855" width="12" height="12" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="620" y="866" font-size="9" fill="#475569">Reports</text>
</svg>
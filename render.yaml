# Render Blueprint Configuration for DefectLoupe
# Docs: https://render.com/docs/blueprint-spec

envVarGroups:
  - name: defectloupe-shared-config
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_EMAIL_VERIFICATION_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web App (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: defectloupe-web
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: defectloupe-auth
          property: host

  # ----------------------------------------------------------------------------
  # 2. Auth Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: defectloupe-auth
    env: docker
    dockerContext: .
    dockerfilePath: services/auth/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: defectloupe-shared-config
      - key: AUTO_VERIFY_EMAIL
        value: "false"
      - key: DEV_AUTO_VERIFY
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_BASE_URL
        value: https://defectloupe-web.onrender.com

  # ----------------------------------------------------------------------------
  # 3. Core Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: defectloupe-core
    env: docker
    dockerContext: .
    dockerfilePath: services/core/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: defectloupe-shared-config

  # ----------------------------------------------------------------------------
  # 4. Media Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: defectloupe-media
    env: docker
    dockerContext: .
    dockerfilePath: services/media/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: defectloupe-shared-config
      - key: UPLOAD_DIR
        value: /data/uploads

  # ----------------------------------------------------------------------------
  # 5. AI & RAG Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: defectloupe-ai
    env: docker
    dockerContext: .
    dockerfilePath: services/ai/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: defectloupe-shared-config
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PUBLIC_VERIFY_URL
        value: https://defectloupe-web.onrender.com/verify

  # ----------------------------------------------------------------------------
  # 6. Celery Async Worker
  # ----------------------------------------------------------------------------
  - type: worker
    name: defectloupe-celery
    env: docker
    dockerContext: .
    dockerfilePath: services/ai/Dockerfile
    dockerCommand: celery -A app.workers.celery_app worker -l info -Q celery,default,stt,vision,reports --concurrency=2
    plan: free
    envVars:
      - fromGroup: defectloupe-shared-config

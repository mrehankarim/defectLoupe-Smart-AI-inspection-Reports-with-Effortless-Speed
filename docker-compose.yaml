# DefectLoupe — microservices orchestration
#
# Services (all listen on port 8000 internally; host ports are unused):
#   gateway       (Traefik)       → 80   (host: 80)  — public entry point
#   auth          (FastAPI)       → 8000             — /auth/*, /inspectors/*
#   core          (FastAPI)       → 8000             — /api/v1/clients, /properties, /inspections, /dashboard
#   media         (FastAPI)       → 8000             — /api/v1/photos, /observations, /transcriptions
#   ai            (FastAPI)       → 8000             — /api/v1/rag, /reports
#   celery-worker (Celery)        → n/a              — async STT, vision, report jobs
#   db            (PostgreSQL)    → 5432 (host: 5433)
#   redis         (Redis)         → 6379 (host: 6379)
#
# Build context is the repo root for every service (so the shared/ package
# can be COPY'd into each image).

services:
  gateway:
    image: traefik:latest
    container_name: defect-loupe-gateway
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yaml"
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "80:80"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - ./services/gateway/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - defectloupe-net

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      args:
        SERVICE_NAME: auth
    image: defectloupe-auth:latest
    container_name: defect-loupe-auth
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`) || PathPrefix(`/inspectors`) || PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.auth.priority=40"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"
    env_file:
      - ./services/auth/app/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/defect-loupe
      ACCESS_TOKEN_SECRET: defectloupe-hackathon-secret
      REFRESH_TOKEN_SECRET: defectloupe-hackathon-secret
      AUTO_VERIFY_EMAIL: "true"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - defectloupe-net

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
      args:
        SERVICE_NAME: core
    image: defectloupe-core:latest
    container_name: defect-loupe-core
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=PathPrefix(`/api/v1/clients`) || PathPrefix(`/api/v1/properties`) || PathPrefix(`/api/v1/inspections`) || PathPrefix(`/api/v1/dashboard`) || PathPrefix(`/api/v1/area-templates`) || PathPrefix(`/api/v1/templates`) || PathPrefix(`/api/v1/demo`)"
      - "traefik.http.routers.core.priority=10"
      - "traefik.http.services.core.loadbalancer.server.port=8000"
    env_file:
      - ./services/core/app/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/defect-loupe
      ACCESS_TOKEN_SECRET: defectloupe-hackathon-secret
      CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - defectloupe-net

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
      args:
        SERVICE_NAME: media
    image: defectloupe-media:latest
    container_name: defect-loupe-media
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=PathPrefix(`/api/v1/photos`) || PathPrefix(`/api/v1/observations`) || PathPrefix(`/api/v1/transcriptions`) || PathPrefix(`/api/v1/areas`) || PathPrefix(`/api/v1/media`)"
      - "traefik.http.routers.media.priority=50"
      - "traefik.http.services.media.loadbalancer.server.port=8000"
    env_file:
      - ./services/media/app/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/defect-loupe
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_SECRET: defectloupe-hackathon-secret
      UPLOAD_DIR: /data/uploads
    volumes:
      - defect-loupe-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - defectloupe-net

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
      args:
        SERVICE_NAME: ai
    image: defectloupe-ai:latest
    container_name: defect-loupe-ai
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/api/v1/rag`) || PathPrefix(`/api/v1/reports`) || PathRegexp(`^/api/v1/photos/[^/]+/analyze/?$`) || PathRegexp(`^/api/v1/inspections/[^/]+/report/.*$`) || PathRegexp(`^/api/v1/inspections/[^/]+/generate-report$`)"
      - "traefik.http.routers.ai.priority=100"
      - "traefik.http.services.ai.loadbalancer.server.port=8000"
    env_file:
      - ./services/ai/app/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/defect-loupe
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_SECRET: defectloupe-hackathon-secret
      CORE_SERVICE_URL: http://core:8000
      MEDIA_SERVICE_URL: http://media:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      core:
        condition: service_started
      media:
        condition: service_started
    networks:
      - defectloupe-net

  celery-worker:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
      args:
        SERVICE_NAME: ai
    image: defectloupe-ai:latest
    container_name: defect-loupe-celery
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      -l info
      -Q default,stt,vision,reports
      --concurrency=2
    env_file:
      - ./services/ai/app/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/defect-loupe
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_SECRET: defectloupe-hackathon-secret
      CORE_SERVICE_URL: http://core:8000
      MEDIA_SERVICE_URL: http://media:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - defectloupe-net

  db:
    image: ankane/pgvector:latest
    container_name: defect-loupe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: defect-loupe
    ports:
      - "5433:5432"
    volumes:
      - defect-loupe-data:/var/lib/postgresql/data
    networks:
      - defectloupe-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d defect-loupe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: defect-loupe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - defect-loupe-redis:/data
    networks:
      - defectloupe-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  defectloupe-net:
    driver: bridge

volumes:
  defect-loupe-data:
  defect-loupe-redis:
  defect-loupe-uploads:

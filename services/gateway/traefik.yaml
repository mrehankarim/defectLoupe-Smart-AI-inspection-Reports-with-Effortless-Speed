# Traefik v3 static configuration.
#
# Mounted into the gateway container. Routes are defined via Docker labels
# in docker-compose.yaml (dynamic configuration).
#
# Traefik dashboard: http://localhost:8080 (insecure, dev only)

entryPoints:
  web:
    address: ":80"

api:
  dashboard: true
  insecure: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: defectloupe-net

log:
  level: INFO

accessLog: {}
